name: Telegram Smoke Test

on:
  workflow_dispatch:

jobs:
  send-test-message:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Validate Telegram secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          test -n "$TELEGRAM_BOT_TOKEN" || (echo "Missing TELEGRAM_BOT_TOKEN" && exit 1)
          test -n "$TELEGRAM_CHAT_ID" || (echo "Missing TELEGRAM_CHAT_ID" && exit 1)

      - name: Send Telegram test message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ["TELEGRAM_BOT_TOKEN"].strip()
          chat_id = os.environ["TELEGRAM_CHAT_ID"].strip()
          repo = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["GITHUB_RUN_ID"]

          if not token or not chat_id:
              raise SystemExit("Telegram token or chat ID is empty")

          text = f"GitHub Actions Telegram smoke test OK\nrepo: {repo}\nrun: {run_id}"
          payload = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": text,
          }).encode("utf-8")

          url = f"https://api.telegram.org/bot{token}/sendMessage"
          req = urllib.request.Request(url, data=payload, method="POST")

          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  body = resp.read().decode("utf-8")
          except urllib.error.HTTPError as exc:
              detail = exc.read().decode("utf-8", errors="replace")
              detail = detail.replace(token, "[REDACTED]")
              print(f"Telegram HTTP error: {exc.code}", file=sys.stderr)
              print("Telegram error details:", detail, file=sys.stderr)
              sys.exit(1)
          except urllib.error.URLError as exc:
              reason = str(exc.reason).replace(token, "[REDACTED]")
              print(f"Telegram connection failed: {reason}", file=sys.stderr)
              sys.exit(1)

          data = json.loads(body)
          print(json.dumps(
              {k: data.get(k) for k in ("ok", "description")},
              ensure_ascii=False,
          ))

          if not data.get("ok"):
              raise SystemExit("Telegram API returned ok=false")
          PY
